name: Renovate

on:
  push:
    branches:
      - main

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install renovate
        run: npm install -g renovate

      - name: Dispatch Renovate PR
        run: |
          RENOVATE_TOKEN="${{ secrets.RENOVATE_TOKEN }}" npx renovate --repository-name ${{ github.repository }} --base-branch main

 

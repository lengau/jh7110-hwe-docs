[project]
name = "jh7110-hwe-docs"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.0,<10",
]

[project.scripts]
mkdocs = "mkdocs.main:main"

[project.optional-dependencies]
dev = [
  "tombi>=1.7.3",
  "google-yamlfmt>=0.5.1",
  "mdformat>=0.3.10",
]

[dependency-groups]
dev = [
  "google-yamlfmt>=0.5.1",
  "mdformat>=0.3.10",
  "tombi>=1.7.3",
]

repos:
  - repo: https://github.com/google/yamlfmt
    rev: v0.5.1
    hooks:
      - id: yamlfmt

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black

  - repo: https://github.com/tombi/tombi
    rev: v1.7.3
    hooks:
      - id: tombi
        args: [--check, --diagnostics-format, pretty]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
